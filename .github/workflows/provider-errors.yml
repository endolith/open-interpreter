name: Provider errors

# A rejected key fails before inference, so this matrix costs nothing and can
# run on every relevant change rather than a scheduled sweep. It checks that
# many providers' error bodies reach the user intact, and that no OpenAI-only
# advice is substituted for them.
on:
  pull_request:
    paths:
      - "interpreter/core/respond.py"
      - "tests/test_provider_error_matrix.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - ".github/workflows/provider-errors.yml"
  push:
    branches: [main]
    paths:
      - "interpreter/core/respond.py"
      - "tests/test_provider_error_matrix.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - ".github/workflows/provider-errors.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  provider-errors:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[server,dev]"
      - name: Run provider error matrix
        env:
          OI_RUN_INTEGRATION: "1"
          OI_INTEGRATION_MODEL: openai/gpt-4o-mini
          OI_RUN_PROVIDER_ERROR_TESTS: "1"
          OPENAI_API_KEY: sk-invalid-open-interpreter-provider-error-test
        run: |
          pytest -m "integration and provider_errors" -q -rs --timeout=120 --junitxml=test-results.xml
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-errors
          path: test-results.xml
          if-no-files-found: ignore
