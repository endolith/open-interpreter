name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test (checks out the PR merge ref). For external fork PRs after reviewing the diff."
        required: false
        type: string
      ref:
        description: "Branch, tag, or SHA (ignored when pr_number is set)."
        required: false
        type: string

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check interpreter tests

  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,dev]"
          if [ "${{ matrix.python-version }}" = "3.14" ]; then
            pytest -m "not integration" \
              --cov=interpreter \
              --cov-branch \
              --cov-report=xml \
              --cov-report=term-missing
          else
            pytest -m "not integration"
          fi

      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  codecov:
    name: Upload to Codecov
    needs: test
    if: >-
      github.event_name != 'workflow_dispatch' &&
      !cancelled() &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Require Codecov token
        if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "${CODECOV_TOKEN}" ]; then
            echo "::error::CODECOV_TOKEN repository secret is required for Codecov uploads from main and same-repository pull requests."
            exit 1
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Needs OPENAI_API_KEY. Only run where secrets are available and the code is trusted:
    # - pushes to main (post-merge verification)
    # - same-repository pull requests (fork PRs cannot access secrets on pull_request)
    # - manual dispatch after reviewing an external fork PR (Actions → Run workflow → pr_number)
    #
    # pull_request_target is intentionally NOT used: it runs with repo secrets and is unsafe
    # for executing fork code. See:
    # https://securitylab.github.com/resources/github-actions-new-patterns-and-mitigations/
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - name: Resolve checkout ref
        id: checkout-ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.pr_number }}" ]; then
            echo "value=refs/pull/${{ inputs.pr_number }}/merge" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.ref }}" ]; then
            echo "value=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.checkout-ref.outputs.value }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,dev]"
          pytest -m integration -rs -sv --timeout=900
