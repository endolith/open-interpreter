name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test (checks out the PR merge ref). For external fork PRs after reviewing the diff."
        required: false
        type: string
      ref:
        description: "Branch, tag, or SHA (ignored when pr_number is set)."
        required: false
        type: string

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check interpreter tests

  test-linux:
    name: Unit tests (Linux)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install language runtimes for e2e smokes
        # azure.archive.ubuntu.com (and occasionally archive.ubuntu.com) stalls
        # mid-download on larger packages (e.g. the 46.5 MB openjdk-21-jre-headless)
        # or on the noble-updates InRelease metadata. apt-get has no timeout, so an
        # unbounded install hangs the job until it is cancelled (~30 min). This
        # action bounds each attempt and retries on failure/timeout; the inner GNU
        # timeout adds --kill-after so a non-cooperative apt-get or dpkg is
        # SIGKILLed before the next attempt rather than leaving a stale lock. The
        # && chain keeps a failed apt-get update from installing from stale
        # indexes. --no-install-recommends keeps the payload to what the smokes
        # need (irb, R, javac/java); node ships on the runner image and Chrome is
        # verified separately.
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 6
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            timeout --kill-after=10s 300 sudo apt-get update \
            && timeout --kill-after=10s 300 sudo apt-get install -y --no-install-recommends ruby irb r-base default-jdk
      # Google Chrome is pre-installed on ubuntu-latest (actions/runner-images).
      # HTML/React smokes find it via require_chrome_for_html() — no .deb download.
      - name: Verify Chrome for HTML/React smokes
        run: command -v google-chrome || command -v google-chrome-stable
      - name: Install and test
        run: |
          uv pip install --system -e ".[server,dev]"
          if [ "${{ matrix.python-version }}" = "3.14" ]; then
            pytest -m "not integration and not windows_ci and not darwin_ci" \
              --cov=interpreter \
              --cov-branch \
              --cov-report=xml \
              --cov-report=term-missing
          else
            pytest -m "not integration and not windows_ci and not darwin_ci"
          fi

      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  test-windows:
    name: Windows CI smoke
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install and run Windows-only tests
        shell: bash
        run: |
          uv pip install --system -e ".[server,dev]"
          pytest -m windows_ci -v

  test-macos:
    name: macOS CI smoke
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install and run macOS-only tests
        run: |
          uv pip install --system -e ".[server,dev]"
          pytest -m darwin_ci -v

  codecov:
    name: Upload to Codecov
    needs: test-linux
    if: >-
      github.event_name != 'workflow_dispatch' &&
      !cancelled() &&
      needs.test-linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Require Codecov token
        if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "${CODECOV_TOKEN}" ]; then
            echo "::error::CODECOV_TOKEN repository secret is required for Codecov uploads from main and same-repository pull requests."
            exit 1
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Needs OPENAI_API_KEY. Only run where secrets are available and the code is trusted:
    # - pushes to main (post-merge verification)
    # - same-repository pull requests (fork PRs cannot access secrets on pull_request)
    # - manual dispatch after reviewing an external fork PR (Actions → Run workflow → pr_number)
    #
    # pull_request_target is intentionally NOT used: it runs with repo secrets and is unsafe
    # for executing fork code. See:
    # https://securitylab.github.com/resources/github-actions-new-patterns-and-mitigations/
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - name: Resolve checkout ref
        id: checkout-ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.pr_number }}" ]; then
            echo "value=refs/pull/${{ inputs.pr_number }}/merge" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.ref }}" ]; then
            echo "value=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.checkout-ref.outputs.value }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OI_RUN_INTEGRATION: "1"
        run: |
          uv pip install --system -e ".[server,dev]"
          pytest -m integration -rs -sv --timeout=300
