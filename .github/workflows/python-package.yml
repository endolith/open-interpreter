name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test (checks out the PR merge ref). For external fork PRs after reviewing the diff."
        required: false
        type: string
      ref:
        description: "Branch, tag, or SHA (ignored when pr_number is set)."
        required: false
        type: string

# Every push to an open PR started a full run, including the integration job,
# so a PR revised several times burned a full run per revision. Cancel the
# older run when a newer one starts. Only a PR's first attempt shares the
# per-ref group: GitHub cancels a *pending* run when a newer run joins its
# group (even with cancel-in-progress false), so a shared main group would
# drop intermediate main commits, and a re-run keeps the old ref and could
# cancel the latest revision.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check interpreter tests .github/scripts

  test-linux:
    name: Unit tests (Linux)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the external tools the edit-tool tests gate on
        run: |
          # These tests skip when the binary is absent, so relying on the runner
          # image to happen to provide them turns coverage off with no signal --
          # the edit suite went untested for `patch` until someone noticed the
          # skips. Installed explicitly rather than assumed.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patch gawk jq
          # Required: a miss here is a real coverage hole, so fail the build.
          for bin in sed gawk patch jq; do
            if ! command -v "$bin" >/dev/null; then
              echo "::error::required test binary missing, edit-tool coverage would silently skip: $bin"
              exit 1
            fi
          done
          # Optional: each needs a release download or an extra repo. Report
          # rather than fail, so the skipped count in the log is explainable.
          for bin in perl yq poke; do
            if command -v "$bin" >/dev/null; then
              echo "present: $bin"
            else
              echo "absent, tests will skip: $bin"
            fi
          done

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Cache apt archives for language runtimes
        # The runtime install downloads ~181 MB per Linux job, four times over.
        # Keep the .debs between runs so a warm cache installs from disk instead
        # of re-downloading from the mirror that stalls.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Only the .deb files: apt runs as root and leaves root-only lock and
          # partial entries, which make tar fail and abort the whole save.
          path: /home/runner/apt-cache/*.deb
          key: apt-${{ runner.os }}-ruby-irb-r-base-default-jdk-v2
          restore-keys: |
            apt-${{ runner.os }}-
      - name: Install language runtimes for e2e smokes
        # azure.archive.ubuntu.com (and occasionally archive.ubuntu.com) stalls
        # mid-download on larger packages (e.g. the 46.5 MB openjdk-21-jre-headless)
        # or on the noble-updates InRelease metadata. apt-get has no timeout, so an
        # unbounded install hangs the job until it is cancelled (~30 min). This
        # action bounds each attempt and retries on failure/timeout; the inner GNU
        # timeout adds --kill-after so a non-cooperative apt-get or dpkg is
        # SIGKILLed before the next attempt rather than leaving a stale lock. The
        # && chain keeps a failed apt-get update from installing from stale
        # indexes. --no-install-recommends keeps the payload to what the smokes
        # need (irb, R, javac/java); node ships on the runner image and Chrome is
        # verified separately. Ruby and the JDK already ship on the runner image,
        # so only install what is actually missing: that drops the 46.5 MB
        # openjdk download (the one that stalls) on a cold cache.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 6
          command: |
            mkdir -p /home/runner/apt-cache/partial
            timeout --kill-after=10s 300 sudo apt-get -o Dir::Cache::archives=/home/runner/apt-cache/ update \
            && {
              missing=""
              { command -v ruby >/dev/null 2>&1 && command -v irb >/dev/null 2>&1; } || missing="$missing ruby irb"
              command -v javac >/dev/null 2>&1 || missing="$missing default-jdk"
              command -v Rscript >/dev/null 2>&1 || missing="$missing r-base"
              if [ -n "$missing" ]; then
                timeout --kill-after=10s 300 sudo apt-get -o Dir::Cache::archives=/home/runner/apt-cache/ install -y --no-install-recommends $missing
              fi
            }
      - name: Verify language runtimes
        run: |
          command -v irb
          command -v Rscript
          command -v javac

      # Google Chrome is pre-installed on ubuntu-latest (actions/runner-images).
      # HTML/React smokes find it via require_chrome_for_html() — no .deb download.
      - name: Verify Chrome for HTML/React smokes
        run: command -v google-chrome || command -v google-chrome-stable
      - name: Install and test
        run: |
          uv pip install --system -e ".[server,dev]"
          if [ "${{ matrix.python-version }}" = "3.14" ]; then
            pytest -m "not integration and not windows_ci and not darwin_ci" \
              -q -rs --junitxml=test-results.xml \
              --cov=interpreter \
              --cov-branch \
              --cov-report=xml \
              --cov-report=term-missing
          else
            pytest -m "not integration and not windows_ci and not darwin_ci" \
              -q -rs --junitxml=test-results.xml
          fi

      - name: Check test selection
        run: |
          python .github/scripts/check_pytest_counts.py test-results.xml 1600 \
            "irb not installed" \
            "R not installed" \
            "jdk not installed" \
            "R is not on PATH" \
            "google-chrome or chromium not installed"

      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  test-windows:
    name: Windows
    # Runs the main suite, not just the windows_ci-marked tests, so that a test
    # which passes on Linux but breaks on Windows fails here instead of never
    # being executed anywhere that could catch it. windows_ci marks the handful
    # of tests meaningful only here (cmd.exe, PowerShell, USERPROFILE); they run
    # in this job too, since it selects everything except darwin_ci.
    # 1191 passed, 0 failed as of 2026-10-03, when this replaced a 9-test
    # windows_ci-only smoke job.
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install and test
        shell: bash
        run: |
          uv pip install --system -e ".[server,dev]"
          pytest -m "not integration and not darwin_ci" -q -rs \
            --junitxml=test-results.xml \
            --cov=interpreter \
            --cov-branch \
            --cov-report=xml

      - name: Check test selection
        run: python .github/scripts/check_pytest_counts.py test-results.xml 1600

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-windows
          path: coverage.xml
          if-no-files-found: error

  test-macos:
    name: macOS
    # As above for macOS; darwin_ci marks the AppleScript and platform-specific
    # tests, which this job also covers. 1190 passed, 0 failed as of 2026-10-03,
    # replacing a 10-test darwin_ci-only smoke job.
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install and test
        run: |
          uv pip install --system -e ".[server,dev]"
          pytest -m "not integration and not windows_ci" -q -rs \
            --junitxml=test-results.xml \
            --cov=interpreter \
            --cov-branch \
            --cov-report=xml

      - name: Check test selection
        run: python .github/scripts/check_pytest_counts.py test-results.xml 1600

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-macos
          path: coverage.xml
          if-no-files-found: error

  codecov:
    name: Upload to Codecov
    needs: [test-linux, test-windows, test-macos]
    if: >-
      github.event_name != 'workflow_dispatch' &&
      !cancelled() &&
      needs.test-linux.result == 'success' &&
      needs.test-windows.result == 'success' &&
      needs.test-macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage-linux

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report-windows
          path: coverage-windows

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report-macos
          path: coverage-macos

      - name: Require Codecov token
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "${CODECOV_TOKEN}" ]; then
            echo "::error::CODECOV_TOKEN is required for Codecov uploads from main and same-repository pull requests. Store it as a Dependabot secret as well as an Actions secret: runs triggered by Dependabot only see Dependabot secrets."
            exit 1
          fi

      - name: Upload Linux coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-linux/coverage.xml
          flags: linux
          fail_ci_if_error: true
          verbose: true

      - name: Upload Windows coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-windows/coverage.xml
          flags: windows
          fail_ci_if_error: true
          verbose: true

      - name: Upload macOS coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-macos/coverage.xml
          flags: macos
          fail_ci_if_error: true
          verbose: true

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Needs the provider key for OI_INTEGRATION_MODEL (OPENROUTER_API_KEY for the
    # default openrouter/ model). Only run where secrets are available and trusted:
    # - pushes to main (post-merge verification)
    # - same-repository pull requests (fork PRs cannot access secrets on pull_request)
    # - manual dispatch after reviewing an external fork PR (Actions → Run workflow → pr_number)
    #
    # pull_request_target is intentionally NOT used: it runs with repo secrets and is unsafe
    # for executing fork code. See:
    # https://securitylab.github.com/resources/github-actions-new-patterns-and-mitigations/
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - name: Resolve checkout ref
        id: checkout-ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.pr_number }}" ]; then
            echo "value=refs/pull/${{ inputs.pr_number }}/merge" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.ref }}" ]; then
            echo "value=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.checkout-ref.outputs.value }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install
        run: uv pip install --system -e ".[server,dev]"

      - name: Require the provider key for the selected model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OI_INTEGRATION_MODEL: openrouter/~deepseek/deepseek-flash-latest
        run: |
          python - <<'PY'
          import os
          import litellm

          model = os.environ["OI_INTEGRATION_MODEL"]
          if model.startswith(("ollama/", "lm_studio/", "lm-studio/")):
              raise SystemExit(0)
          try:
              environment = litellm.validate_environment(model)
          except Exception as error:
              print(f"::error::could not resolve the provider key for {model}: {error}")
              raise SystemExit(1)
          if not environment.get("keys_in_environment", True):
              missing = ", ".join(
                  environment.get("missing_keys") or ["provider credentials"]
              )
              print(f"::error::{missing} is required for {model}")
              raise SystemExit(1)
          PY

      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Baseline model for the integration job.
          OI_INTEGRATION_MODEL: openrouter/~deepseek/deepseek-flash-latest
          OI_RUN_INTEGRATION: "1"
        run: |
          pytest -m "integration and not provider_matrix" -rs -sv --timeout=300 --junitxml=test-results.xml

      - name: Check test selection
        run: python .github/scripts/check_pytest_counts.py test-results.xml 1
