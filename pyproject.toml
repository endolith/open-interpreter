[project]
name = "open-interpreter"
version = "0.4.3" # Use "-rc1", "-rc2", etc. for pre-release versions
description = "Let language models run code"
readme = "README.md"
requires-python = ">=3.10,<4"
authors = [
    { name = "Killian Lucas", email = "killian@openinterpreter.com" },
    { name = "endolith", email = "endolith@gmail.com" },
]
dependencies = [
    "setuptools",
    "astor>=0.8.1,<0.9.0",
    "inquirer>=3.1.3,<4.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "rich>=13.4.2,<14.0.0",
    "six>=1.16.0,<2.0.0",
    "tokentrim>=0.1.13,<0.2.0",
    "wget>=3.2,<4.0.0",
    "psutil>=5.9.6,<6.0.0",
    "pyreadline3>=3.4.1,<4.0.0; sys_platform == 'win32'",
    "html2image>=2.0.4.3,<3.0.0",
    "send2trash>=1.8.2,<2.0.0",
    "ipykernel>=6.26.0,<7.0.0",
    "jupyter-client>=8.6.0,<9.0.0",
    "matplotlib>=3.8.2,<4.0.0",
    "tiktoken>=0.8.0",
    "platformdirs>=4.2.0,<5.0.0",
    "pydantic>=2.6.4,<3.0.0",
    "google-generativeai>=0.7.1,<0.8.0",
    "pyperclip>=1.9.0,<2.0.0",
    "yaspin>=3.0.2,<4.0.0",
    "shortuuid>=1.0.13,<2.0.0",
    "litellm>=1.41.26,<2.0.0",
    "orjson>=3.9.0,<4.0.0",
    "starlette>=0.37.2,<0.38.0",
    "html2text>=2024.2.26,<2025.0.0",
    "selenium>=4.24.0,<5.0.0",
    "webdriver-manager>=4.0.2,<5.0.0",
    "anthropic>=0.37.1,<0.38.0",
    "pyautogui>=0.9.54,<0.10.0",
    "typer>=0.12.5,<0.13.0",
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn>=0.30.1,<0.31.0",
]

[project.optional-dependencies]
os = [
    "opencv-python>=4.8.1.78,<5.0.0",
    "pyautogui>=0.9.54,<0.10.0",
    "plyer>=2.1.0,<3.0.0",
    "pywinctl>=0.3,<0.4",
    "pytesseract>=0.3.10,<0.4.0",
    "sentence-transformers>=2.5.1,<3.0.0",
    "nltk>=3.8.1,<4.0.0",
    "ipywidgets>=8.1.2,<9.0.0",
    "timm>=0.9.16,<0.10.0",
    "screeninfo>=0.8.1,<0.9.0",
]
safe = [
    "semgrep>=1.52.0,<2.0.0",
]
local = [
    "opencv-python>=4.8.1.78,<5.0.0",
    "pytesseract>=0.3.10,<0.4.0",
    "torch>=2.2.1,<3.0.0",
    "transformers==4.41.2",
    "einops>=0.8.0,<0.9.0",
    "torchvision>=0.18.0,<0.19.0",
    "easyocr>=1.7.1,<2.0.0",
]
server = [
    "fastapi>=0.111.0,<0.112.0",
    "janus>=1.0.0,<2.0.0",
    "uvicorn>=0.30.1,<0.31.0",
]
dev = [
    "black>=23.10.1,<24.0.0",
    "isort>=5.12.0,<6.0.0",
    "pre-commit>=3.5.0,<4.0.0",
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "sniffio>=1.3.0,<2.0.0",
    "websockets>=13.1,<14.0.0",
]

[project.scripts]
i = "interpreter.terminal_interface.start_terminal_interface:main"
interpreter = "interpreter.terminal_interface.start_terminal_interface:main"
wtf = "scripts.wtf:main"
interpreter-classic = "interpreter.terminal_interface.start_terminal_interface:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["interpreter", "scripts"]

[tool.black]
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true

[tool.coverage.run]
# The Anthropic computer-use demo is deprecated and slated for removal
# (docs/ROADMAP.md); exclude it from coverage until it's deleted.
omit = ["interpreter/computer_use/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E401",
    "E402",
    "E711",
    "E712",
    "E713",
    "E721",
    "E722",
    "E741",
    "F401",
    "F541",
    "F811",
    "F841",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: calls an LLM, costs money, and executes generated code without approval; requires OI_RUN_INTEGRATION=1 and OPENAI_API_KEY",
    "mock_llm: uses a local OpenAI-compatible HTTP server (no API key)",
    "timeout(duration): fail if the test runs longer than duration seconds (pytest-timeout)",
    "linux_ci: runs on Linux CI and locally on Linux hosts",
    "windows_ci: runs on Windows CI and locally on Windows hosts",
    "darwin_ci: runs on macOS CI and locally on Darwin hosts",
]

[tool.ruff.lint.per-file-ignores]
"interpreter/core/computer/display/display.py" = ["F821"]
"interpreter/core/computer/display/point/point.py" = ["F821"]
"interpreter/core/llm/utils/convert_to_openai_messages.py" = ["F821"]
"interpreter/core/respond.py" = ["F821"]
"tests/test_interpreter.py" = ["F821"]
